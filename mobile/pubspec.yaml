name: datamint_mobile
description: "DataMint Mobile - Decentralized AI Dataset Marketplace for Contributors and Creators"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing & Navigation
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Typography & Design
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3

  # Web3 & Cryptography
  web3dart: ^2.7.3

  # Media Handling & Sensors
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  record: ^5.1.2
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
