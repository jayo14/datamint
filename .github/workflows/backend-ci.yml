name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint, Type Check, and Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datamint
          POSTGRES_PASSWORD: datamint_password
          POSTGRES_DB: datamint_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: uv run ruff check app tests

      - name: Run Ruff Format Check
        run: uv run ruff format --check app tests

      - name: Run Mypy Static Type Analysis
        run: uv run mypy app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://datamint:datamint_password@localhost:5432/datamint_test_db
        run: uv run alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://datamint:datamint_password@localhost:5432/datamint_test_db
        run: uv run pytest -v
