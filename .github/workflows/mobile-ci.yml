name: Mobile Application CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
    tags:
      - "v*"
      - "mobile-v*"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update GitHub Release"
        required: false
        type: boolean
        default: true
      tag_name:
        description: "Release tag name (e.g. v1.0.0 - leave blank to use pubspec.yaml version)"
        required: false
        type: string
        default: ""
      is_prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Flutter Analyze and Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test --coverage

  build-apk:
    name: Build Android APK and Publish Release
    runs-on: ubuntu-latest
    needs: [analyze-and-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Android APK (Release)
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK Release Assets & Checksums
        id: prep_assets
        run: |
          OUTPUT_DIR="mobile/build/app/outputs/flutter-apk"
          if [ ! -f "${OUTPUT_DIR}/app-release.apk" ]; then
            echo "Error: app-release.apk was not generated at ${OUTPUT_DIR}!" >&2
            exit 1
          fi

          APP_VERSION=$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "Detected app version: ${APP_VERSION}"

          # Create standardized and versioned copies for users
          cp "${OUTPUT_DIR}/app-release.apk" "${OUTPUT_DIR}/datamint-mobile.apk"
          cp "${OUTPUT_DIR}/app-release.apk" "${OUTPUT_DIR}/datamint-mobile-v${APP_VERSION}.apk"

          # Generate SHA256 checksums
          cd "${OUTPUT_DIR}"
          sha256sum datamint-mobile.apk > datamint-mobile.apk.sha256
          sha256sum "datamint-mobile-v${APP_VERSION}.apk" > "datamint-mobile-v${APP_VERSION}.apk.sha256"
          sha256sum app-release.apk > app-release.apk.sha256
          cd - > /dev/null

          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: datamint-mobile-apk
          path: |
            mobile/build/app/outputs/flutter-apk/datamint-mobile.apk
            mobile/build/app/outputs/flutter-apk/datamint-mobile-v*.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/*.sha256
          retention-days: 30

      - name: Determine Release Metadata
        id: release_meta
        if: |
          github.event_name == 'release' ||
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          APP_VERSION="${{ steps.prep_assets.outputs.app_version }}"
          
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            RELEASE_NAME="${{ github.event.release.name || github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="DataMint Mobile ${TAG_NAME}"
            PRERELEASE="false"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="v${APP_VERSION}"
            fi
            RELEASE_NAME="DataMint Mobile ${TAG_NAME}"
            PRERELEASE="${{ inputs.is_prerelease }}"
          else
            # Push to main
            TAG_NAME="v${APP_VERSION}"
            RELEASE_NAME="DataMint Mobile v${APP_VERSION}"
            PRERELEASE="false"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'release' ||
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/datamint-mobile.apk
            mobile/build/app/outputs/flutter-apk/datamint-mobile-v${{ steps.prep_assets.outputs.app_version }}.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/*.sha256
