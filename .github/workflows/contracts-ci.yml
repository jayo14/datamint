name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Build and Test Smart Contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify Compiler & Toolchain
        run: |
          forge --version
          grep 'solc_version = "0.8.24"' foundry.toml
          grep 'optimizer = true' foundry.toml

      - name: Build Contracts
        run: forge build --sizes

      - name: Run Unit, Fuzz, and Invariant Test Suites
        run: forge test -vv --match-test "test|invariant"
