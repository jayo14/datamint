# ==============================================================================
# DataMint Infrastructure as Code (Render Cloud Blueprint)
# Deploys: PostgreSQL 16 + Redis + FastAPI Monolith + Celery Worker + Celery Beat
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # DataMint FastAPI Monolith API
  # ----------------------------------------------------------------------------
  - type: web
    name: datamint-backend-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    region: frankfurt
    healthCheckPath: /api/v1/health/healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: PORT
        value: "8000"
      - key: WORKERS
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: datamint-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: datamint-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CELO_RPC_URL
        value: https://forno.celo.org
      - key: CELO_CHAIN_ID
        value: "42220"
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: PLATFORM_SIGNER_PRIVATE_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Task Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: datamint-celery-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.worker
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    plan: standard
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: datamint-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: datamint-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: datamint-backend-api
          envVarKey: JWT_SECRET_KEY
      - key: CELO_RPC_URL
        value: https://forno.celo.org
      - key: CELO_CHAIN_ID
        value: "42220"
      - key: ESCROW_CONTRACT_ADDRESS
        fromService:
          type: web
          name: datamint-backend-api
          envVarKey: ESCROW_CONTRACT_ADDRESS
      - key: PLATFORM_SIGNER_PRIVATE_KEY
        fromService:
          type: web
          name: datamint-backend-api
          envVarKey: PLATFORM_SIGNER_PRIVATE_KEY

  # ----------------------------------------------------------------------------
  # Celery Beat Periodic Task Scheduler
  # ----------------------------------------------------------------------------
  - type: worker
    name: datamint-celery-beat
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.worker
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    plan: starter
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: datamint-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: datamint-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: datamint-backend-api
          envVarKey: JWT_SECRET_KEY
      - key: CELO_RPC_URL
        value: https://forno.celo.org
      - key: CELO_CHAIN_ID
        value: "42220"
      - key: ESCROW_CONTRACT_ADDRESS
        fromService:
          type: web
          name: datamint-backend-api
          envVarKey: ESCROW_CONTRACT_ADDRESS
      - key: PLATFORM_SIGNER_PRIVATE_KEY
        fromService:
          type: web
          name: datamint-backend-api
          envVarKey: PLATFORM_SIGNER_PRIVATE_KEY

# ------------------------------------------------------------------------------
# Managed Database and Cache
# ------------------------------------------------------------------------------
databases:
  - name: datamint-postgres
    databaseName: datamint_prod
    user: datamint_admin
    plan: standard
    region: frankfurt
    postgresMajorVersion: "16"

  - type: redis
    name: datamint-redis
    plan: standard
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
